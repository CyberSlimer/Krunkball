# XcodeGen spec — run `xcodegen generate` on a Mac to produce Crunchball3000.xcodeproj
name: Crunchball3000
options:
  bundleIdPrefix: com.rprobst
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Crunchball3000:
    type: application
    platform: iOS
    sources:
      - path: Crunchball3000
        excludes:
          - "Info.plist"
    info:
      path: Crunchball3000/Info.plist
      properties:
        CFBundleDisplayName: Crunchball 3000
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rprobst.crunchball3000
        SUPPORTS_MACCATALYST: NO
