# XcodeGen spec — run `xcodegen generate` on a Mac to produce Krunkball.xcodeproj
name: Krunkball
options:
  bundleIdPrefix: com.rprobst
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Krunkball:
    type: application
    platform: iOS
    sources:
      - path: Krunkball
        excludes:
          - "Info.plist"
    info:
      path: Krunkball/Info.plist
      properties:
        CFBundleDisplayName: Krunkball
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rprobst.krunkball
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - KrunkballTests
  KrunkballTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KrunkballTests
    dependencies:
      - target: Krunkball
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rprobst.krunkball.tests
